      setPushStatus('Varsler er registrert på denne telefonen! Automatisk utsending aktiveres senere.');
    } catch (err) {
      setPushStatus('Kunne ikke aktivere varsler: ' + (err.message || 'ukjent feil'));
    } finally { pushButton.disabled = false; }
  };
  async function authRequest(payload) {
    const r=await fetch(AUTH_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},body:JSON.stringify(payload)});
    let body={};try{body=await r.json();}catch{}
    if(!r.ok)throw Error(body.error||'Innlogging feilet ('+r.status+').');
    return body;
  }
  async function finishLogin(result) {
    if(!result.session?.access_token||!result.session?.refresh_token)throw Error('Innloggingen ga ingen gyldig sesjon.');
    const {data,error}=await client.auth.setSession({access_token:result.session.access_token,refresh_token:result.session.refresh_token});
    if(error||!data.user)throw Error(error?.message||'Kunne ikke lagre innloggingen.');
    await showRoom(data.user);
  }
  $('chat-login-form').onsubmit=async e=>{
    e.preventDefault();if(busy)return;const id=selected();if(!participant(id)){status('chat-auth-status','Velg navnet ditt først.',true);return;}
    setBusy(true);status('chat-auth-status','Logger inn …');
    try{const result=await authRequest({action:'login',participant_id:id,pin:$('chat-login-pin').value});await finishLogin(result);$('chat-login-pin').value='';}
    catch(err){status('chat-auth-status',err.message||'Innlogging feilet.',true);}finally{setBusy(false);}
  };
  $('chat-activate-form').onsubmit=async e=>{
    e.preventDefault();if(busy)return;const id=selected();if(!participant(id)){status('chat-auth-status','Velg navnet ditt først.',true);return;}
    const newPin=$('chat-new-pin').value;
    if(newPin!==$('chat-confirm-pin').value){status('chat-auth-status','De personlige PIN-kodene er ikke like.',true);return;}
    if(!/^\d{6,12}$/.test(newPin)){status('chat-auth-status','Personlig PIN må være 6–12 siffer.',true);return;}
    setBusy(true);status('chat-auth-status','Aktiverer kontoen …');
    try{const result=await authRequest({action:'activate',participant_id:id,invite:$('chat-invite').value.trim().toUpperCase(),pin:$('chat-first-pin').value,new_pin:newPin});await finishLogin(result);['chat-invite','chat-first-pin','chat-new-pin','chat-confirm-pin'].forEach(id=>$(id).value='');}
    catch(err){status('chat-auth-status',err.message||'Aktivering feilet. Ikke prøv gjentatte ganger; kontakt arrangøren.',true);}finally{setBusy(false);}
  };
  $('chat-logout').onclick=async()=>{await client.auth.signOut();await showLoggedOut();};
  async function showLoggedOut(){if(channel){await client.removeChannel(channel);channel=null;}currentUser=null;myParticipant=null;loaded=false;firstChatRender=true;imageUrls.clear();$('chat-room').hidden=true;$('chat-auth-card').hidden=false;$('chat-feed').replaceChildren();}
  async function showRoom(user){
    currentUser=user;
    const {data:me,error}=await client.from('newcastle_participants').select('id,full_name,company').eq('auth_user_id',user.id).maybeSingle();
    if(error||!me){await client.auth.signOut();await showLoggedOut();throw Error('Denne kontoen er ikke koblet til en Newcastle-deltaker. Kontakt arrangøren.');}
    myParticipant=me;firstChatRender=true;$('chat-who').textContent='Innlogget: '+me.full_name;$('chat-auth-card').hidden=true;$('chat-room').hidden=false;
    refreshPushStatus();
    await loadMessages();
    if(channel)await client.removeChannel(channel);
    channel=client.channel('newcastle-chat-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'newcastle_messages'},()=>loadMessages()).on('postgres_changes',{event:'*',schema:'public',table:'newcastle_message_likes'},()=>loadMessages()).subscribe();
  }
  async function loadMessages(){
    if(!currentUser)return;if(loaded){reloadPending=true;return;}loaded=true;
    try{
      const {data,error}=await client.from('newcastle_messages').select('id,participant_id,body,image_path,created_at').order('created_at',{ascending:false}).limit(150);
      if(error)throw error;
      const messages=(data||[]).reverse();const feed=$('chat-feed');const nearBottom=firstChatRender || feed.scrollHeight-feed.scrollTop-feed.clientHeight<110;
      const messageIds=messages.map(m=>m.id);const likesByMessage=new Map();const mineLikes=new Set();
      if(messageIds.length){
        const {data:likes,error:likesError}=await client.from('newcastle_message_likes').select('message_id,participant_id').in('message_id',messageIds);
        if(likesError)throw likesError;
        for(const like of likes||[]){likesByMessage.set(String(like.message_id),(likesByMessage.get(String(like.message_id))||0)+1);if(like.participant_id===myParticipant?.id)mineLikes.add(String(like.message_id));}
      }
      feed.replaceChildren();
      if(!messages.length){const hint=document.createElement('p');hint.className='chat-loading';hint.textContent='Ingen meldinger ennå. Bli den første som skriver!';feed.appendChild(hint);}
      for(const m of messages){
        const p=participant(m.participant_id),box=document.createElement('div');box.className='chat-message'+(myParticipant?.id===m.participant_id?' mine':'');
        const header=document.createElement('div');const who=document.createElement('span');who.className='by';who.textContent=p?.[1]||'Deltaker';const when=document.createElement('span');when.className='when';when.textContent=new Date(m.created_at).toLocaleString('nb-NO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});header.append(who,when);box.appendChild(header);
        if(m.body){const text=document.createElement('p');text.textContent=m.body;box.appendChild(text);}
        if(m.image_path){const a=document.createElement('a');a.target='_blank';a.rel='noopener noreferrer';const img=document.createElement('img');img.alt='Bilde delt av '+(p?.[1]||'deltaker');img.loading='lazy';a.appendChild(img);box.appendChild(a);
          const cached=imageUrls.get(m.image_path);if(cached&&cached.expires>Date.now()){img.src=cached.url;a.href=cached.url;}else{
            client.storage.from(bucket).createSignedUrl(m.image_path,3600).then(({data,error})=>{if(!error&&data?.signedUrl){imageUrls.set(m.image_path,{url:data.signedUrl,expires:Date.now()+3500000});img.src=data.signedUrl;a.href=data.signedUrl;}else{a.textContent='Bildet kunne ikke lastes';}});
          }
        }
        const liked=mineLikes.has(String(m.id));const count=likesByMessage.get(String(m.id))||0;
        const likeBtn=document.createElement('button');likeBtn.type='button';likeBtn.className='chat-like'+(liked?' active':'');likeBtn.textContent='👍 '+(count||'');likeBtn.setAttribute('aria-label',(liked?'Fjern likerklikk':'Lik melding')+', '+count+' likerklikk');likeBtn.setAttribute('aria-pressed',String(liked));
        likeBtn.onclick=async()=>{likeBtn.disabled=true;try{let result;if(liked){result=await client.from('newcastle_message_likes').delete().eq('message_id',m.id).eq('participant_id',myParticipant.id);}else{result=await client.from('newcastle_message_likes').insert({message_id:m.id,participant_id:myParticipant.id});}if(result.error)throw result.error;await loadMessages();}catch(e){alert('Kunne ikke lagre 👍: '+(e.message||'ukjent feil'));}finally{likeBtn.disabled=false;}};
        box.appendChild(likeBtn);
        feed.appendChild(box);
      }
      if(nearBottom){feed.scrollTop=feed.scrollHeight;requestAnimationFrame(()=>{feed.scrollTop=feed.scrollHeight;});if(firstChatRender)scrollChatToLatest();}firstChatRender=false;
    }catch(err){$('chat-feed').textContent='Kunne ikke hente meldinger: '+(err.message||'ukjent feil')+'. Kontroller at SQL-oppsettet er kjørt.';}
    finally{loaded=false;if(reloadPending){reloadPending=false;loadMessages();}}
  }
  $('chat-send-form').onsubmit=async e=>{
    e.preventDefault();if(busy||!myParticipant)return;
    const body=$('chat-text').value.trim(),file=$('chat-file').files[0];if(!body&&!file){status('chat-send-status','Skriv en melding eller velg et bilde.',true);return;}
    if(body.length>2000){status('chat-send-status','Maks 2000 tegn.',true);return;}
    if(file&&(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024)){status('chat-send-status','Velg JPEG, PNG eller WebP under 10 MB.',true);return;}
    setBusy(true);status('chat-send-status','Sender …');let path=null;
    try{
      if(file){const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[file.type];path=currentUser.id+'/'+crypto.randomUUID()+'.'+ext;
        const {error:uploadError}=await client.storage.from(bucket).upload(path,file,{contentType:file.type,upsert:false});if(uploadError)throw uploadError;
      }
      const {error}=await client.from('newcastle_messages').insert({participant_id:myParticipant.id,body:body||null,image_path:path});
      if(error){if(path)await client.storage.from(bucket).remove([path]);throw error;}
      $('chat-text').value='';$('chat-file').value='';$('chat-file-name').textContent='';status('chat-send-status','Sendt!');await loadMessages();$('chat-feed').scrollTop=$('chat-feed').scrollHeight;
    }catch(err){status('chat-send-status','Kunne ikke sende: '+(err.message||'ukjent feil'),true);}finally{setBusy(false);}
  };
  client.auth.getUser().then(async ({data,error})=>{if(!error&&data?.user){try{await showRoom(data.user);}catch(err){status('chat-auth-status',err.message,true);}}}).catch(()=>{});
})();
</script>
<script>
// LIVE: Personlige flybilletter, separat fra felles chat men med samme Supabase-økt.
(() => {
  'use strict';
  const root = document.getElementById('billetter');
  const URL = 'https://jknsiinfemijosrgfdpl.supabase.co';
  const KEY = 'sb_publishable_6C3Ibvp0tUGpdkcYcEsr0Q_edqB56Sb';
  const BUCKET = 'newcastle-flight-tickets';
  const names = [
    [1,'Sebastian Nenseth'],[2,'Benjamin Thuve'],[3,'Fritz Ryan Domingo'],[4,'Frode Hegg'],
    [5,'Fayez Fadie'],[6,'Benjamin Johannessen'],[7,'Filips Grindulis'],[8,'Marius Horni'],
    [9,'Sarkawt Kareemi'],[10,'Stian Abrahamsen'],[11,'Kenneth Hårsaker'],[12,'Nicklas Huse'],
    [13,'Børre Syversen'],[14,'Sondre Thorsen'],[15,'Christian Sjøsaasen'],[16,'Petter Sørebø'],
    [17,'Mats Hovland'],[18,'Erik Bjerke']
  ];
  root.innerHTML = `<article class="card"><h2>✈️ Mine flybilletter</h2><p class="muted">Din personlige flybillett er kun tilgjengelig når du er logget inn. Bruk samme PIN-innlogging som i felles chat.</p><div id="ticket-status" class="ticket-status" role="status" aria-live="polite">Kontrollerer innlogging …</div><div id="ticket-self"></div></article><article class="card" id="ticket-admin" hidden><h2>🗂️ Administrer flybilletter</h2><p class="muted">Kun for arrangører. Last opp én PDF per deltaker (maks 10 MB). En ny opplasting erstatter den tidligere billetten.</p><div id="ticket-list" class="ticket-grid"></div></article>`;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const setStatus = (s,err=false) => { $('ticket-status').textContent=s; $('ticket-status').classList.toggle('error',err); };
  if (!window.supabase?.createClient) {setStatus('Kunne ikke laste inn innloggingstjenesten.',true);return;}
  const db = window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  let me = null, admin = false, docs = [], busy = false;
  const isAdmin = p => p && (p.id === 15 || p.id === 16);
  async function refresh(){
    const {data:{user},error:authError}=await db.auth.getUser();
    if(authError || !user){me=null;admin=false;docs=[];$('ticket-self').replaceChildren();$('ticket-admin').hidden=true;setStatus('Logg inn under 💬 Chat, og kom tilbake hit for å se din billett.');return;}
    const {data:p,error:pe}=await db.from('newcastle_participants').select('id,full_name').eq('auth_user_id',user.id).maybeSingle();
    if(pe||!p){setStatus('Innlogget konto er ikke koblet til en deltaker.',true);return;}
    me=p;admin=isAdmin(p);
    const {data:rows,error:de}=await db.from('newcastle_flight_tickets').select('participant_id,file_path,updated_at').order('participant_id');
    if(de){setStatus('Billetter er ikke klargjort i LIVE-databasen ennå: '+de.message,true);return;}
    docs=rows||[];
    setStatus('Innlogget som '+me.full_name+'.');
    renderSelf();renderAdmin();
  }
  async function openTicket(path){
    // Open a tab synchronously on click so mobile browsers don't block it.
    const tab=window.open('about:blank','_blank');
    try{
      const {data,error}=await db.storage.from(BUCKET).createSignedUrl(path,120);
      if(error||!data?.signedUrl)throw Error(error?.message||'Kunne ikke åpne billetten.');
      if(tab){tab.opener=null;tab.location.replace(data.signedUrl);}
      else window.location.href=data.signedUrl;
    }catch(e){if(tab)tab.close();throw e;}
  }
  function renderSelf(){
    const own=docs.find(x=>x.participant_id===me.id);
    $('ticket-self').innerHTML=own?`<div class="ticket-row"><div><strong>📄 Flybillett – ${esc(me.full_name)}</strong><small>PDF · personlig dokument</small></div><div class="ticket-actions"><button id="ticket-open-mine" type="button">Åpne billetten ↗</button></div></div>`:`<p class="muted">Din flybillett er ikke lastet opp ennå. Du får tilgang her når arrangøren har lagt den inn.</p>`;
    if(own)$('ticket-open-mine').onclick=()=>openTicket(own.file_path).catch(e=>setStatus(e.message,true));
  }
  function renderAdmin(){
    $('ticket-admin').hidden=!admin;if(!admin)return;
    $('ticket-list').innerHTML=names.map(([id,name])=>{
      const doc=docs.find(x=>x.participant_id===id);
      return `<div class="ticket-row" data-ticket-id="${id}"><div><strong>${esc(name)}</strong><small class="ticket-pill ${doc?'':'missing'}">${doc?'✓ Billett lastet opp':'Mangler billett'}</small></div><div class="ticket-actions"><input class="ticket-upload" type="file" accept="application/pdf,.pdf" aria-label="Velg PDF for ${esc(name)}"><button class="ticket-save" type="button">${doc?'Erstatt PDF':'Last opp PDF'}</button>${doc?'<button class="ticket-view" type="button">Se PDF</button>':''}</div></div>`;
    }).join('');
    $('ticket-list').querySelectorAll('[data-ticket-id]').forEach(row=>{
      const id=Number(row.dataset.ticketId),doc=docs.find(x=>x.participant_id===id);
      row.querySelector('.ticket-save').onclick=()=>uploadTicket(id,row);
      if(doc)row.querySelector('.ticket-view').onclick=()=>openTicket(doc.file_path).catch(e=>setStatus(e.message,true));
    });
  }
  async function uploadTicket(id,row){
    if(busy)return;
    const file=row.querySelector('input[type=file]').files[0];
    if(!file){setStatus('Velg en PDF først.',true);return;}
    if(file.size>10*1024*1024||file.size===0||(!file.name.toLowerCase().endsWith('.pdf'))){setStatus('Velg en PDF på maksimalt 10 MB.',true);return;}
    if(!window.confirm('Last opp billetten til '+names.find(x=>x[0]===id)[1]+'? Kontroller at PDF-en tilhører riktig person.'))return;
    busy=true;row.querySelector('.ticket-save').disabled=true;
    const old=docs.find(x=>x.participant_id===id);
    const path=id+'/'+crypto.randomUUID()+'.pdf';
    setStatus('Laster opp billett …');
    try{
      const {error:ue}=await db.storage.from(BUCKET).upload(path,file,{contentType:'application/pdf',upsert:false});
      if(ue)throw ue;
      const {error:de}=await db.from('newcastle_flight_tickets').upsert({participant_id:id,file_path:path,updated_at:new Date().toISOString()},{onConflict:'participant_id'});
      if(de){await db.storage.from(BUCKET).remove([path]);throw de;}
      if(old?.file_path && old.file_path!==path){const {error:removeError}=await db.storage.from(BUCKET).remove([old.file_path]);if(removeError)console.warn('Gammel billett må eventuelt slettes manuelt:',removeError.message);}
      await refresh();setStatus('PDF lastet opp for '+names.find(x=>x[0]===id)[1]+'.');
    }catch(e){setStatus('Opplasting feilet: '+(e.message||'ukjent feil'),true);}
    finally{busy=false;row.querySelector('.ticket-save')?.removeAttribute('disabled');}
  }
  document.querySelector('[data-tab="billetter"]').addEventListener('click',()=>refresh().catch(e=>setStatus(e.message,true)));
  db.auth.onAuthStateChange(()=>{setTimeout(()=>refresh().catch(e=>setStatus(e.message,true)),0);});
  refresh().catch(e=>setStatus(e.message,true));
})();
</script>
