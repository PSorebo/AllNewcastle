<article class="card" id="gaucho-meny"><div class="date">LØRDAG 31. OKTOBER · KL. 19:00</div><h2>🥩 Gaucho – Signature Menu</h2><p class="muted">Tre retter · £75 per person. Velg én forrett, én hovedrett og én dessert. Hovedretter serveres med chips eller grønne grønnsaker med salsa verde; biff serveres med chimichurri.</p><a class="menu-action" href="gaucho-signature-menu.png" target="_blank" rel="noopener">🔎 Åpne menyen i full størrelse ↗</a><img class="restaurant-menu" src="gaucho-signature-menu.png" alt="Gaucho Signature Menu med forretter, hovedretter og desserter" loading="lazy"><p class="note">Menyen er på engelsk, slik den ble sendt inn. Informer restauranten om allergier og spesielle matbehov.</p></article>
<article class="card" id="my-delhi-meny"><div class="date">SØNDAG 1. NOVEMBER · KL. 19:30</div><h2>🍛 My Delhi – gruppemeny</h2><p class="muted">Papadams med chutney mens vi venter. Velg én Street Plates-tallerken og én Roadside Curry per person. Curry serveres med ris, naan, chips og dal til deling.</p><a class="menu-action" href="my-delhi-group-menu.jpg" target="_blank" rel="noopener">🔎 Åpne menyen i full størrelse ↗</a><img class="restaurant-menu" src="my-delhi-group-menu.jpg" alt="My Delhi Group Menu med vegetar, vegansk og kjøttbasert street plates, samt ni curry-retter" loading="lazy"><p class="note">Menyen er på engelsk og er hentet fra bildet arrangøren har sendt inn. Oppgi allergier og spesielle matbehov til restauranten.</p></article>`);

['🛍️ Shopping i sentrum','Typiske søndagstider: Primark 10:30–17:00 (kun kikking før 11:00), Sports Direct 11:00–17:00 og Eldon Square 11:00–17:00. Tidene kan endres – sjekk før besøket.','Primark Northumberland Street Newcastle'],
['🧺 Quayside Sunday Market','Åpent søndag 1. november kl. 09:30–16:00 (britisk tid). Marked langs elven med boder, småmat og hyggelig stemning. Utendørs og væravhengig; tidene kan endres.','Newcastle Quayside Market'],

<script>
(()=>{
const places=[
['hotel','🏨','Leonardo Hotel Newcastle','Hotell','Scotswood Road · 31. okt.–3. nov.','Leonardo Hotel Newcastle Scotswood Road Newcastle NE1 4AD'],
['mat','🥩','Gaucho Newcastle','Restaurant','Lørdag 31. oktober kl. 19:00','Gaucho Newcastle upon Tyne'],
['mat','🍛','My Delhi','Restaurant','Søndag 1. november kl. 19:30','My Delhi Newcastle upon Tyne'],
['mat','🍖','Rio Brazilian Steakhouse Quayside','Restaurant','Mandag 2. november kl. 13:00 · avventer bekreftelse','Rio Brazilian Steakhouse Quayside Newcastle upon Tyne'],
['kamp','⚽','St. James’ Park','Fotball','Newcastle–Everton · mandag kl. 20:00','St James Park Newcastle upon Tyne'],
['se','🌉','Tyne Bridge','Severdighet','Ikonisk bro over Tyne','Tyne Bridge Newcastle upon Tyne'],
['se','🌊','Newcastle Quayside','Severdighet','Elvepromenade og restauranter','Newcastle Quayside'],
['se','🌉','Gateshead Millennium Bridge','Severdighet','Gang- og sykkelbro over elven','Gateshead Millennium Bridge'],
['se','🏛️','Grey’s Monument','Severdighet','Sentrum og godt møtested','Greys Monument Newcastle upon Tyne'],
['se','🏰','Newcastle Castle','Severdighet','Historisk borg nær elven','Newcastle Castle Newcastle upon Tyne'],
['se','🛍️','Eldon Square','Shopping','Butikker midt i sentrum','Eldon Square Newcastle upon Tyne'],
['se','🛍️','Grainger Market','Shopping','Historisk innendørsmarked','Grainger Market Newcastle upon Tyne'],
['pub','🍺','Shearer’s Bar','Pub / sportsbar','Aktuell før kamp eller for TV-fotball','Shearers Bar Newcastle upon Tyne'],
['pub','📺','Shark Club','Pub / sportsbar','Mulig sted å se fotball søndag','Shark Club Newcastle upon Tyne'],
['pub','🍺','The Tyne Bar','Pub','Ouseburn-området','The Tyne Bar Newcastle upon Tyne'],
['pub','🍺','The Free Trade Inn','Pub','Utsikt over Tyne','Free Trade Inn Newcastle upon Tyne']
];
const groupNames={alle:'Alle',hotel:'🏨 Hotell',mat:'🍽️ Restauranter',kamp:'⚽ Stadion',se:'🏛️ Severdigheter',pub:'🍺 Puber'};
const groupColors={hotel:'#008d7e',mat:'#b57920',kamp:'#181f2a',se:'#176da1',pub:'#8148a5'};
let active='alle',map,markers=[],loaded=0;
const filters=document.getElementById('map-filters'),cards=document.getElementById('map-locations'),status=document.getElementById('map-status');
const gm=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const directions=q=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q)+'&travelmode=walking';
function visible(p){return active==='alle'||p[0]===active}
function redraw(){
 filters.innerHTML=Object.entries(groupNames).map(([k,v])=>`<button class="map-filter ${k===active?'active':''}" data-map-filter="${k}" aria-pressed="${k===active}">${v}</button>`).join('');
 filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.mapFilter;redraw()});
 cards.innerHTML='';markers.forEach(({p,m})=>{if(map){if(visible(p))m.addTo(map);else map.removeLayer(m)}});
 places.filter(visible).forEach(p=>{let card=document.createElement('div');card.className='place-card';let button=document.createElement('button');button.innerHTML=`<strong>${p[1]} ${p[2]}</strong><small>${p[4]}</small>`;button.onclick=()=>{let found=markers.find(x=>x.p===p);if(found&&map){map.setView(found.m.getLatLng(),16);found.m.openPopup()}else window.open(gm(p[5]),'_blank','noopener')};card.appendChild(button);let a=document.createElement('a');a.href=directions(p[5]);a.target='_blank';a.rel='noopener noreferrer';a.textContent='🚶 Veibeskrivelse ↗';card.appendChild(a);cards.appendChild(card)});
}
redraw();
if(typeof L==='undefined'){status.textContent='Karttjenesten er ikke tilgjengelig akkurat nå. Bruk lenkene til veibeskrivelse nedenfor.';return}
map=L.map('newcastle-map',{scrollWheelZoom:false}).setView([54.974,-1.613],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-bidragsytere'}).addTo(map);
const store='allnewcastle-map-coordinates-v1';let cache={};try{cache=JSON.parse(localStorage.getItem(store)||'{}')}catch{}
function pin(p,lat,lon){if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<54.8||lat>55.2||lon< -1.9||lon> -1.3)return;
let icon=L.divIcon({className:'',html:`<div class="place-pin" style="background:${groupColors[p[0]]}">${p[1]}</div>`,iconSize:[33,33],iconAnchor:[16,16]});let m=L.marker([lat,lon],{icon});
let wrap=document.createElement('div');let title=document.createElement('strong');title.textContent=p[2];wrap.appendChild(title);wrap.appendChild(document.createElement('br'));wrap.appendChild(document.createTextNode(p[4]));wrap.appendChild(document.createElement('br'));let a=document.createElement('a');a.textContent='🚶 Få veibeskrivelse ↗';a.href=directions(p[5]);a.target='_blank';a.rel='noopener noreferrer';wrap.appendChild(a);m.bindPopup(wrap);markers.push({p,m});if(visible(p))m.addTo(map);loaded++;status.textContent=`${loaded} av ${places.length} steder plassert på kartet. Trykk på markørene for detaljer.`}
const pending=[];places.forEach(p=>{let c=cache[p[5]];if(c&&c.length===2)pin(p,+c[0],+c[1]);else pending.push(p)});
async function geocode(){for(const p of pending){try{const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q='+encodeURIComponent(p[5]);let r=await fetch(u,{headers:{'Accept':'application/json'}});if(!r.ok)throw Error('Lookup failed');let data=await r.json();if(data.length){let lat=+data[0].lat,lon=+data[0].lon;cache[p[5]]=[lat,lon];try{localStorage.setItem(store,JSON.stringify(cache))}catch{}pin(p,lat,lon)}}catch(e){/* Links still work if a place is not found */}await new Promise(resolve=>setTimeout(resolve,1200))}
status.textContent=`${loaded} av ${places.length} steder funnet. Manglende steder kan åpnes med Google Maps-lenkene.`}
geocode();document.querySelector('[data-tab="kart"]').addEventListener('click',()=>{setTimeout(()=>map.invalidateSize(),120)});
})();
</script>
